function navBar(){return `<nav class="mainnav" aria-label="Sezioni del gioco"><div class="inner">${[['map','🗺️','Mappa'],['hero','🧙','Eroe'],['bag','🎒','Sacca'],['journal','📜','Diario']].map(([id,icon,label])=>`<button class="navbtn ${s.tab===id?'active':''}" data-tab="${id}" aria-label="${label}" aria-current="${s.tab===id?'page':'false'}"><span>${icon}</span><span>${label}</span></button>`).join('')}</div></nav>`}
function btn(action,label,cls='secondary',extra=''){return `<button class="btn ${cls}" data-act="${action}" ${extra}>${label}</button>`}
function heroArt(){return `<div class="heroart"><svg viewBox="0 0 700 225" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#2b4d5f"/><stop offset="1" stop-color="#152731"/></linearGradient></defs><rect width="700" height="225" fill="url(#sky)"/><circle cx="535" cy="48" r="34" fill="#e7d4a3" opacity=".76"/><path d="M0 130L92 72l80 50 119-83 115 91 108-47 186 47v95H0Z" fill="#27404a"/><path d="M0 160l70-43 100 42 105-51 115 55 132-47 178 56v53H0Z" fill="#1b3540"/><path d="M370 137h85v-42h15v-19h25v19h15v45h22v85H350v-82h20Z" fill="#0f222d"/><path d="M404 137v-20h23v20M465 136v-20h21v20" fill="#e6b772" opacity=".75"/><path d="M355 174q-57-28-116-12L0 194v31h700v-48q-99-41-210-8Z" fill="#152b2a"/><path d="M50 193l20-61 17 61m18 0 28-77 24 77m360 0 18-62 15 62m14 0 21-79 24 79" stroke="#0b2021" stroke-width="7" stroke-linejoin="round" fill="none"/><path d="M210 225q57-54 154-61 41-4 86 5" stroke="#ae935b" stroke-width="11" opacity=".4" fill="none"/></svg><div class="heroart-caption">Il Sigillo dell’Aurora</div></div>`}
function creation(){const b=s.build;const r=ROLES[b.role];const step=s.step||0;if(step===0)return `<section class="card">${heroArt()}<h1>Un mondo da scoprire</h1><p>A Valdombra le scelte contano. Esplora una regione, affronta nemici, costruisci rapporti e rischia tutto per sciogliere un antico mistero.</p><div class="notice goodnote">Non richiede account o servizi esterni durante la partita; i progressi vengono salvati nel browser. Apri il gioco online da Safari.</div><div style="height:13px"></div>${btn('create-next','Crea il tuo personaggio →','')}</section>`;
if(step===1)return `<section class="card"><div class="eyebrow">Creazione · 1 di 3</div><h2>Chi sei?</h2><label class="label" for="heroName">Nome del personaggio</label><input id="heroName" class="field" maxlength="24" value="${esc(b.name)}" placeholder="Nome dell'eroe"/><label class="label">Stirpe</label><div class="cols">${Object.entries(LINEAGES).map(([id,a])=>`<button class="portrait ${b.lineage===id?'selected':''}" data-lineage="${id}"><span class="em">${a.icon}</span><strong>${a.name}</strong><span class="tiny">${a.desc}</span></button>`).join('')}</div><label class="label">Classe</label><div class="cols">${Object.entries(ROLES).map(([id,a])=>`<button class="portrait ${b.role===id?'selected':''}" data-class="${id}"><span class="em">${a.icon}</span><strong>${a.name}</strong><span class="tiny">${a.skill}</span></button>`).join('')}</div><p class="tiny" style="margin-top:10px">${r.hint}</p><div class="btnrow">${btn('create-back','← Indietro','ghost')}${btn('create-next','Continua →','')}</div></section>`;
if(step===2)return `<section class="card"><div class="eyebrow">Creazione · 2 di 3</div><h2>Tira le caratteristiche</h2><p>Per ciascun valore lancia <strong>4d6</strong>: il dado più basso viene scartato. Completa sei lanci, poi assegna i punteggi.</p><div class="rolls">${b.rolls.map((entry,i)=>`<div class="rollitem"><span class="tiny">Tiro ${i+1}</span><div class="dicechips">${entry.dice.map((v,j)=>`<span class="${j===entry.cut?'cut':''}">${v}</span>`).join('')}</div><strong style="color:var(--gold)">${entry.total}</strong></div>`).join('')}</div><div class="divider"></div>${b.rolls.length<6?btn('roll-stat',`🎲 Lancia 4d6 (${b.rolls.length+1}/6)`,''):btn('create-next','Assegna le caratteristiche →','')}<div class="btnrow" style="margin-top:9px">${btn('create-back','← Indietro','ghost')}${btn('reroll-stats','Ricomincia i tiri','ghost')}</div></section>`;
const complete=b.assign.every(v=>Number.isInteger(v)&&v>=0&&v<6)&&new Set(b.assign).size===6;
return `<section class="card"><div class="eyebrow">Creazione · 3 di 3</div><h2>La tua scheda</h2><p>Distribuisci liberamente i sei punteggi alle caratteristiche. Il modificatore è calcolato automaticamente.</p><div class="statlist">${ABIL.map((a,i)=>`<div class="stat"><small>${a}</small><select class="ability-select" data-stat="${i}" aria-label="${a}"><option value="-1">Scegli</option>${b.rolls.map((v,j)=>`<option value="${j}" ${b.assign[i]===j?'selected':''}>${v.total} ${signed(mod(v.total))}</option>`).join('')}</select></div>`).join('')}</div><div style="height:12px"></div>${btn('auto-assign','✨ Distribuisci per la tua classe','secondary')}<div class="notice" style="margin:11px 0">I tuoi tiri resteranno gli stessi: potrai riassegnarli finché non avvii l'avventura.</div><div class="btnrow">${btn('create-back','← Indietro','ghost')}${btn('finish-create','Inizia Valdombra →','',complete?'':'disabled')}</div></section>`}
function playView(){return `${heroMini()}${s.tab==='map'?worldView():s.tab==='hero'?heroView():s.tab==='bag'?bagView():journalView()}`}
function heroMini(){const h=s.hero;return `<div class="card" style="padding:12px 14px"><div class="topstats"><span class="name">${ROLES[h.role].icon} ${esc(h.name)} <span class="tiny">Lv ${h.level} · ${ROLES[h.role].name}</span></span><span class="tiny">❤️ ${h.hp}/${h.maxHp} PF</span></div><div class="meter"><i style="width:${clamp(h.hp/h.maxHp*100,0,100)}%"></i></div></div>`}
function worldView(){return `<section class="card"><div class="panelhead"><h2 style="margin:0">La regione</h2><span class="badge gold">🪙 ${s.gold} monete</span></div><div class="mapbox">${mapSvg()}</div><div class="map-key">Tocca un luogo sulla mappa per raggiungerlo. Le rovine richiedono il sigillo e la chiave.</div><div class="locgrid">${Object.entries(PLACES).map(([id,p])=>`<button class="locbutton ${s.location===id?'current':''}" data-travel="${id}"><span class="em">${p.icon}</span><strong>${p.name}</strong><small>${p.sub}</small></button>`).join('')}</div></section>${sceneView()}`}
function mapSvg(){const pt=[['village',169,157,'🏘️','Valdombra'],['forest',278,65,'🌲','Selva Chiara'],['mine',64,204,'⛏️','Miniera'],['shrine',283,215,'⛪','Santuario'],['ruins',87,61,'🏛️','Rovine']];let trees='';[[246,42],[266,37],[287,41],[306,47],[244,75],[287,95],[307,91],[228,95],[318,61]].forEach(([x,y])=>trees+=`<path d="M${x} ${y+10}l8 -18 8 18h-5l3 7h-12l3-7Z" fill="#6b8966" stroke="#576d50" stroke-width=".8"/>`);let hills='';[[45,101],[68,112],[113,116],[248,270],[271,277]].forEach(([x,y])=>hills+=`<path d="M${x-20} ${y+8}l20 -24 20 24" stroke="#b7a88b" stroke-width="2" fill="none"/>`);return `<svg viewBox="0 0 350 315" role="img" aria-label="Mappa illustrata di Valdombra, con cinque località selezionabili"><defs><radialGradient id="parch"><stop stop-color="#f1e6c8"/><stop offset="1" stop-color="#d2bd97"/></radialGradient></defs><rect width="350" height="315" fill="url(#parch)"/><path d="M0 35Q85 10 172 28T350 12M0 280Q100 263 192 296T350 274" stroke="#bdac87" stroke-width="2" fill="none" opacity=".5"/>${trees}${hills}<path d="M0 238Q60 258 99 283t107 15 144-37" fill="none" stroke="#9ac4c3" stroke-width="13" opacity=".65"/><path d="M169 157Q131 96 87 61M169 157Q232 102 278 65M169 157Q99 169 64 204M169 157Q229 182 283 215" fill="none" stroke="#a98b5c" stroke-width="7" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M169 157Q131 96 87 61M169 157Q232 102 278 65M169 157Q99 169 64 204M169 157Q229 182 283 215" fill="none" stroke="#eee0b6" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/><text x="17" y="22" font-size="10" letter-spacing="2" font-family="Georgia" fill="#786245">LE TERRE DELL’AURORA</text><g transform="translate(319,20)" fill="#7b6c50"><path d="M0 -10L-5 7 0 3 5 7Z"/><text x="0" y="18" text-anchor="middle" font-size="9">N</text></g>${pt.map(([id,x,y,emoji,label])=>`<g class="mapnode ${s.location===id?'active':''} ${id==='ruins'&&(!has('sigil')||!has('key'))?'locked':''}" data-travel="${id}" role="button" tabindex="0" aria-label="Vai a ${label}"><circle cx="${x}" cy="${y}" r="23"/><text x="${x}" y="${y+8}" font-size="22" text-anchor="middle">${emoji}</text><text class="maplabel" x="${x}" y="${y+39}">${label}</text></g>`).join('')}</svg>`}
function has(id){return (s.bag[id]||0)>0}
function add(id,n=1){s.bag[id]=(s.bag[id]||0)+n;if(s.bag[id]<=0)delete s.bag[id]}
function allowedPlace(id){return !!PLACES[id]}
function sceneView(){const id=s.location;let output='';if(s.shop)output=shopView();else if(s.dialog)output=dialogView();else output=locationView(id);return `<section class="card" id="sceneCard"><div class="eyebrow">${esc(PLACES[id].sub)}</div><h2>${PLACES[id].icon} ${esc(PLACES[id].name)}</h2>${output}</section>`}
function opt(action,label,cls='secondary',extra=''){return btn(action,label,cls,extra)}
function locationView(id){if(id==='village')return `<p>Le lanterne illuminano la piazza. Si sente il profumo del pane caldo e, da qualche parte, una canzone stonata. La vita continua anche con le rovine che incombono sulla vallata.</p><div class="choices">${opt('elder','👵 Parla con l’anziana Elara')}${opt('healer','🌿 Visita l’erborista Mira')}${opt('shop','🛒 Entra nella bottega di Tovin')}${opt('inn','🍲 Riposa alla locanda')}</div>`;
if(id==='forest')return `<p>Sotto il fogliame filtrano raggi dorati. Un ruscello attraversa un sentiero di funghi luminosi. Lyria ascolta i rumori tra gli alberi, mentre Borin controlla le impronte.</p><div class="choices">${!s.flags.sigilFound&&s.quest.main?opt('trail','🔎 Segui le tracce del sigillo'):s.flags.sigilFound?`<div class="notice goodnote">Hai già recuperato il sigillo del bosco.</div>`:`<div class="notice">Elara potrebbe sapere cosa cercare nel bosco.</div>`}${!s.flags.herbsGathered?opt('gather','🌿 Cerca le erbe lunari'):`<div class="tiny">Il prato delle erbe è stato già esplorato.</div>`}${!s.flags.hutSeen?opt('hut','🏚️ Esamina la capanna abbandonata'):''}</div>`;
if(id==='mine')return `<p>Vecchi binari scompaiono sotto la montagna. Nell'aria c'è odore di ferro e polvere. Da una galleria provengono voci concitate.</p><div class="choices">${s.quest.main&&!s.flags.mineCleared?opt('mine-fight','⚔️ Entra nella galleria occupata'):s.flags.mineCleared?`<div class="notice goodnote">Hai scacciato i predoni e recuperato la chiave di rame.</div>`:`<div class="notice">Potresti cercare informazioni da Elara prima di affrontare i predoni.</div>`}${!s.flags.lanternFound?opt('lantern','🏮 Cerca la lanterna smarrita'):`<div class="tiny">Hai già esplorato il deposito laterale.</div>`}</div>`;
if(id==='shrine')return `<p>Al centro del santuario in rovina, una vasca di pietra riflette il cielo. Alcune incisioni raccontano di un custode creato per proteggere la valle.</p><div class="choices">${!s.flags.shrineTried?opt('shrine-rune','✨ Decifra le rune sull’altare'):`<div class="notice ${s.flags.blessed?'goodnote':''}">${s.flags.blessed?'Una benedizione accompagna il tuo gruppo.':'Le rune sono ormai silenziose.'}</div>`}${!s.flags.hermit?opt('hermit','🧓 Parla con il pellegrino'):''}</div>`;
if(id==='ruins'){const access=has('sigil')&&has('key');if(!access)return `<p>Un arco di pietra sbarra il passaggio. Due nicchie, una circolare e una a forma di chiave, custodiscono il segreto dell'ingresso.</p><div class="notice alert">Per entrare servono il Sigillo del bosco e la Chiave di rame. ${has('sigil')?'✅ Sigillo':'❌ Sigillo'} · ${has('key')?'✅ Chiave':'❌ Chiave'}</div>`;if(!s.flags.sentriesCleared)return `<p>Il sigillo emette una luce tenue. La chiave gira lentamente e il portale si apre, rivelando due sentinelle animate dalla magia.</p><div class="choices">${opt('ruins-guards','⚔️ Affronta le sentinelle')}</div>`;if(!s.flags.mainComplete)return `<p>Una sala circolare custodisce il Custode dell'Aurora, un antico guardiano che veglia sulla valle. Sembra pronto a combattere, ma i suoi occhi di luce indugiano sul simbolo che porti.</p><div class="choices">${opt('guardian-talk','🗣️ Prova a ragionare col Custode')}${opt('guardian-fight','⚔️ Affrontalo senza esitazione')}</div>`;return `<div class="notice goodnote">Hai concluso la missione principale. Le rovine sono finalmente in pace.</div>${opt('epilogue','📖 Rileggi l’epilogo')}`}
return ''}
function dialogView(){const d=s.dialog;if(!d)return '';const back=opt('close-dialog','← Torna al luogo','ghost');if(d.id==='elder'){
if(!s.quest.main)return `<div class="scene"><p class="quote">«Il Sigillo dell’Aurora un tempo teneva in pace queste terre. Da quando è scomparso, le rovine non dormono più.»</p><p>Elara indica due segni tracciati su una pergamena: un simbolo nascosto nella Selva Chiara e una chiave custodita nella vecchia miniera.</p></div><div class="choices">${opt('accept-main','Accetta di cercare il sigillo e la chiave','')}${opt('elder-reward','Chiedi una ricompensa prima di partire')}${back}</div>`;
return `<p>Elara sfoglia una carta dei sentieri. «Il bosco nasconde un sigillo. La miniera custodisce una chiave. Senza entrambi, le rovine resteranno chiuse.»</p><div class="notice">${has('sigil')?'✅ Sigillo recuperato':'▫️ Sigillo da recuperare'} · ${has('key')?'✅ Chiave recuperata':'▫️ Chiave da recuperare'}</div><div class="choices">${opt('elder-advice','Chiedi un consiglio')}${back}</div>`}
if(d.id==='elderReward')return `<p>Elara sorride stancamente. «Non ho grandi ricchezze, ma posso offrirti alcune monete per il viaggio. Promettimi soltanto che non abbandonerai chi ha bisogno.»</p><div class="choices">${opt('accept-reward','Accetta l’anticipo di 8 monete','')}${opt('accept-main','Rinuncia all’anticipo e accetta la missione')}${back}</div>`;
if(d.id==='healer')return `<div class="scene"><p class="quote">«Se riuscissi a trovare le erbe lunari nella Selva Chiara, potrei preparare una cura per il villaggio.»</p><p>Mira mostra un piccolo vaso vuoto e sospira.</p></div><div class="choices">${has('herb')&&!s.flags.herbDelivered?opt('deliver-herbs','🌿 Consegna le erbe lunari',''):!s.flags.herbDelivered?opt('accept-herbs','Prometti di cercare le erbe'):`<div class="notice goodnote">Grazie al tuo aiuto, Mira può curare gli abitanti.</div>`}${back}</div>`;
if(d.id==='inn')return `<p>La locandiera versa una zuppa fumante. «Un letto pulito, una ciotola calda e nessuna domanda: 5 monete.»</p><p>Un riposo completo ripristina i PF del gruppo e le cariche delle capacità speciali. Le scelte già compiute non vengono annullate.</p><div class="choices">${opt('rest','🍲 Riposa per 5 monete','',s.gold>=5?'':'disabled')}${!s.flags.mercyRest&&s.gold<5?opt('mercy-rest','Chiedi ospitalità per una notte'):''}${back}</div>`;
if(d.id==='hut')return `<p>All'interno della capanna trovi una scatola con 9 monete e un biglietto: «Per chi ne avrà bisogno quando tornerò».</p><p>Lyria osserva le monete con interesse. Borin invece sembra pensieroso.</p><div class="choices">${opt('hut-take','Prendi le monete e lascia il biglietto')}${opt('hut-leave','Lascia tutto al proprietario')}${back}</div>`;
if(d.id==='hermit')return `<p>Un vecchio pellegrino sta lucidando una pietra azzurra. «Il custode non è malvagio», racconta. «Ma ormai vede ogni visitatore come una minaccia.»</p><div class="choices">${opt('hermit-kind','Offri acqua e ascolta il suo racconto')}${opt('hermit-rude','Taglia corto e chiedi la strada')}${back}</div>`;
if(d.id==='guardian')return `<p>La voce del Custode risuona nella sala: «Perché cercate di spezzare il giuramento dell'Aurora?»</p><p>Lyria ti lancia un'occhiata: «Potremmo convincerlo che siamo qui per aiutare.»</p><div class="choices">${opt('guardian-persuade','Prova a convincerlo · Carisma CD 15','')}${opt('guardian-fight','Estrai l’arma e combatti')}${back}</div>`;
if(d.id==='test')return `<div class="notice ${d.success?'goodnote':'alert'}">${d.success?'✓ Prova riuscita':'✕ Prova fallita'} · d20 ${d.roll} ${signed(d.bonus)} = ${d.total} contro CD ${d.dc}</div><p>${esc(d.message)}</p><div class="choices">${opt('test-next',d.button||'Continua →','')}</div>`;
if(d.id==='info')return `<p>${esc(d.message)}</p><div class="choices">${back}</div>`;
return back}
function shopView(){const market=['potion','fineSword','bow','focus','ward','steel'];return `<p>Tovin, mercante dai baffi immensi, dispone la merce sul bancone. «Prezzi onesti! Almeno per chi non sa contrattare.»</p><div class="badges" style="margin:10px 0"><span class="badge gold">🪙 ${s.gold} monete</span>${s.flags.lanternDelivered?'<span class="badge mint">Sconto del mercante: −3</span>':''}</div><h3>Acquista</h3><div class="items">${market.filter(id=>id==='potion'||ITEMS[id].for.includes(s.hero.role)).map(id=>{const it=ITEMS[id],price=Math.max(1,it.price-(s.flags.lanternDelivered?3:0));return `<div class="item"><div class="itemicon">${it.icon}</div><div class="itemtext"><strong>${it.name}</strong><small>${it.desc} · 🪙 ${price}</small></div><button class="btn sm" data-buy="${id}" ${s.gold<price?'disabled':''}>Compra</button></div>`}).join('')}</div>${has('lantern')&&!s.flags.lanternDelivered?`<div class="divider"></div><div class="notice">Tovin si interrompe: «Ma quella è la mia lanterna! Credevo di averla persa nella miniera!»</div>${btn('deliver-lantern','🏮 Restituisci la lanterna','good')}`:''}<div class="divider"></div><h3>Vendi</h3><div class="items">${Object.entries(s.bag).filter(([id,n])=>n>0&&ITEMS[id]&&ITEMS[id].price>0&&id!=='potion'&&id!==s.equip.weapon&&id!==s.equip.armor).map(([id,n])=>`<div class="item"><div class="itemicon">${ITEMS[id].icon}</div><div class="itemtext"><strong>${ITEMS[id].name} ×${n}</strong><small>Prezzo di vendita: 🪙 ${Math.floor(ITEMS[id].price/2)}</small></div><button class="btn sm secondary" data-sell="${id}">Vendi</button></div>`).join('')||'<p class="tiny">Nessun oggetto vendibile non equipaggiato.</p>'}</div><div style="height:12px"></div>${btn('close-shop','← Esci dalla bottega','ghost')}</div>`}
function heroStats(){const h=s.hero;const a=h.stats;return `<div class="statlist">${ABIL.map((st,i)=>`<div class="stat"><small>${st}</small><b>${a[i]}</b><small>mod. ${signed(mod(a[i]))}</small></div>`).join('')}</div>`}
function heroView(){const h=s.hero;const next=h.level<3?[0,45,125][h.level]:null;return `<section class="card"><div class="eyebrow">Scheda del personaggio</div><h2>${ROLES[h.role].icon} ${esc(h.name)}</h2><div class="badges"><span class="badge gold">Livello ${h.level}</span><span class="badge">${LINEAGES[h.lineage].name}</span><span class="badge">${ROLES[h.role].name}</span></div><div class="divider"></div><div class="cols"><div><span class="tiny">Punti ferita</span><h3>❤️ ${h.hp} / ${h.maxHp}</h3></div><div><span class="tiny">Classe Armatura</span><h3>🛡️ ${heroAC()}</h3></div><div><span class="tiny">Bonus attacco</span><h3>⚔️ ${signed(attackBonus())}</h3></div><div><span class="tiny">Capacità speciali</span><h3>✨ ${h.charges}/${h.maxCharges}</h3></div></div><div class="divider"></div><h3>Caratteristiche</h3>${heroStats()}<div class="divider"></div><h3>Esperienza e crescita</h3><p>PE attuali: <strong>${h.xp}</strong>${next===null?' · Livello massimo della demo raggiunto':` · Prossimo livello: ${next}`}</p><div class="meter blue"><i style="width:${next===null?100:clamp((h.xp-(h.level===1?0:45))/(next-(h.level===1?0:45))*100,0,100)}%"></i></div><p class="tiny" style="margin-top:9px">Bonus scelti: ${h.talents.length?h.talents.map(x=>x==='power'?'Precisione':x==='vigor'?'Vigore':'Energia').join(', '):'nessuno'}.</p><div class="divider"></div><h3>Compagni</h3>${s.companions.map(c=>`<div class="portraitline"><div class="avatar">${c.icon}</div><div class="panelgrow"><strong>${c.name}</strong><div class="tiny">${c.hp}/${c.max} PF · CA ${c.ac}</div><div class="meter blue" style="margin:4px 0"><i style="width:${clamp(c.hp/c.max*100,0,100)}%"></i></div><div class="trust">Fiducia: ${trustLabel(c.trust)}</div></div></div>`).join('')}<details><summary>Salvataggi e gestione</summary><p class="tiny" style="margin-top:9px">La partita si salva automaticamente in questo browser. Se cancelli i dati di Safari potresti perdere i progressi.</p><div class="choices">${btn('export-save','⬇️ Esporta una copia del salvataggio','ghost')}${btn('reset-game','⚠️ Inizia una nuova partita','danger')}</div></details></section>`}
function trustLabel(t){return t>=2?'Alta ✦✦':t===1?'Buona ✦':t===0?'Neutra':t===-1?'Diffidente':'Molto diffidente'}
function heroAC(){let base=ITEMS[s.equip.armor]?.ac??11;const dex=mod(s.hero.stats[1]);return Math.max(9,base+(s.hero.role==='warrior'?Math.min(1,Math.max(-1,dex)):Math.min(3,dex)))+s.hero.acBonus}
function attackBonus(){const h=s.hero;const statIndex=h.role==='warrior'?0:h.role==='rogue'?1:3;return 2+mod(h.stats[statIndex])+h.attackBonus}

 else if(isAlly){threshold=foe.ac;bonus=actor.id==='lyria'?5:3;targetName=foe.name;damageDie=actor.id==='lyria'?6:6;plus=actor.id==='lyria'?2:2}
 else{threshold=targ==='hero'?heroAC()+(c.defending?2:0):s.companions.find(x=>x.id===targ)?.ac||12;bonus=foe.atk;targetName=actorName(targ);damageDie=foe.die;plus=foe.plus}
 const hit=d===20||(d!==1&&d+bonus>=threshold);let damage=hit?Math.max(1,rollDamage(damageDie)+plus+(d===20?rollDamage(damageDie):0)):0;if(hit&&isHero&&k==='special')damage+=roll(6)+Math.max(1,s.hero.level);
 if(hit){if(isHero||isAlly)foe.hp=Math.max(0,foe.hp-damage);else if(targ==='hero'){s.hero.hp=Math.max(0,s.hero.hp-damage)}else{const c2=s.companions.find(x=>x.id===targ);c2.hp=Math.max(0,c2.hp-damage)}}
 const dead=hit&&(isHero||isAlly?foe.hp<=0:targ==='hero'?s.hero.hp===0:s.companions.find(x=>x.id===targ)?.hp<=0);
 const area=['al fianco','alla spalla','al braccio','alla gamba'];const loc=area[roll(area.length)-1];
 let story;
 if(!hit){const miss=['Il colpo sibila nell’aria, ma il bersaglio si scansa appena in tempo.','La lama incontra la pietra e solleva una pioggia di scintille.','L’avversario para il colpo con un movimento brusco.'];story=`${name} tenta di colpire ${targetName}. ${miss[roll(miss.length)-1]}`}
 else if(isHero){story=dead?`Colpisci ${targetName} con decisione. L'avversario si accascia a terra: è fuori combattimento.`:s.hero.role==='mage'?`Una scarica di luce raggiunge ${targetName} ${loc}. Il bagliore lascia una scia nell’aria.`:`La tua ${k==='special'?'manovra speciale':'arma'} ferisce ${targetName} ${loc}, costringendolo a indietreggiare.`}
 else if(actor.id==='lyria')story=dead?`La freccia di Lyria raggiunge ${targetName}. Il nemico crolla e smette di combattere.`:`Lyria sfrutta un varco nella guardia e ferisce ${targetName} ${loc}. Ti rivolge un cenno complice.`;
 else if(actor.id==='borin')story=dead?`Borin colpisce ${targetName} con il martello, mettendolo fuori combattimento.`:`Borin avanza con lo scudo sollevato e colpisce ${targetName} ${loc}.`;
 else story=dead?`${name} colpisce ${targetName}, che cade a terra senza più riuscire a combattere.`:`${name} balza in avanti e raggiunge ${targetName} ${loc}. Il colpo causa ${damage} danni.`;
 if(d===20&&hit)story=`Colpo critico! ${story}`;
 if(targ==='hero'&&!isAlly&&!isHero&&s.hero.hp===0)story+=' Crolli a terra privo di sensi: al tuo turno dovrai tirare contro la morte.';
 result(name,k==='special'?ROLES[s.hero.role].skill:'Attacco',hit?(d===20?'COLPO CRITICO!':'COLPITO!'):'MANCATO!',story,d,bonus,threshold,hit?damage:null,hit,hit?'⚔️':'🛡️');return}
}
function nextCombat(){if(s.phase!=='combat'||s.combat.stage!=='result')return;const c=s.combat;if(c.death.fail>=3){s.phase='ending';s.ending='dead';emit(`${s.hero.name} è morto durante il combattimento.`);render();return}if(c.escape){let lost=Math.min(4,s.gold);s.gold-=lost;s.location='village';s.phase='play';s.combat=null;adjustTrust('borin',-1);emit(`Il gruppo fugge verso Valdombra. Perdute ${lost} monete.`);render();return}if(foesDead()){finishBattle();return}c.idx++;if(c.idx>=c.order.length){c.idx=0;c.round++;combatLog(`— Inizio round ${c.round} —`)}if(c.round>65){s.phase='ending';s.ending='dead';emit('Il gruppo non riesce più a resistere.');render();return}for(let i=0;i<c.order.length*2;i++){const a=current();if(activeActor(a))break;c.idx++;if(c.idx>=c.order.length){c.idx=0;c.round++;combatLog(`— Inizio round ${c.round} —`)}}if(!c.foes.some(f=>f.id===c.target&&f.hp>0))c.target=aliveFoes()[0]?.id;if(current()?.id==='hero'){c.defending=false;if(s.hero.hp<=0&&c.death.stable&&s.companions.every(x=>x.hp<=0)){s.phase='ending';s.ending='dead';render();return}}c.stage='turn';c.report=null;ui.autoQueued='';render()}
function finishBattle(){const c=s.combat,id=c.id;gainXP(BATTLES[id].xp);emit(`Vittoria: ${BATTLES[id].name}.`);s.phase='play';s.combat=null;s.tab='map';if(s.hero.hp<=0){s.hero.hp=1;emit('Borin ti rimette in piedi dopo lo scontro: 1 PF.')}if(id==='scouts'){s.flags.sigilFound=true;add('sigil');gainXP(22);s.dialog={id:'info',message:'Dopo l’imboscata trovi un sigillo inciso in una pietra cava. Lyria annuisce: «Era questo che cercavamo.»'};adjustTrust('lyria',1)}
 else if(id==='wolves'){s.flags.herbsGathered=true;add('herb');gainXP(9);s.dialog={id:'info',message:'Scacciati i lupi, raccogli un fascio di erbe lunari ancora intatte. Mira ne sarà felice.'}}
 else if(id==='mine'){s.flags.mineCleared=true;add('key');gainXP(28);s.dialog={id:'info',message:'Dietro il nascondiglio del capobanda trovi una chiave di rame con il simbolo dell’Aurora. Borin sorride: «Abbiamo fatto un passo avanti.»'}}
 else if(id==='sentries'){s.flags.sentriesCleared=true;gainXP(17);s.dialog={id:'info',message:'Le sentinelle si sgretolano, liberando il passaggio verso la sala centrale delle rovine.'}}
 else if(id==='guardian'){s.flags.mainComplete=true;gainXP(65);s.phase='ending';s.ending='won'}
 maybeLevel();render()}
function info(message){s.shop=false;s.dialog={id:'info',message};render()}
function closeScene(){s.dialog=null;s.shop=false;maybeLevel();render()}

if(act==='create-next'){if(s.step===1&&!b.name.trim()){flash('Inserisci un nome per il personaggio.');return}if(s.step===2&&b.rolls.length!==6){flash('Completa prima i sei tiri.');return}s.step=Math.min(3,s.step+1);render();return}

if(act==='roll-stat'){if(b.rolls.length<6){const dice=Array.from({length:4},()=>roll(6)),cut=dice.indexOf(Math.min(...dice)),total=dice.reduce((a,x)=>a+x,0)-dice[cut];b.rolls.push({dice,cut,total});render()}return}
if(act==='reroll-stats'){if(b.rolls.length&&!confirm('Vuoi cancellare i tiri appena effettuati e ricominciare?'))return;b.rolls=[];b.assign=Array(6).fill(-1);render();return}
if(act==='auto-assign'){if(b.rolls.length!==6)return;const priorities=b.role==='warrior'?[0,2,1,4,3,5]:b.role==='rogue'?[1,2,4,0,5,3]:[3,2,1,4,5,0];const sorted=b.rolls.map((r,i)=>({i,total:r.total})).sort((a,z)=>z.total-a.total);b.assign=Array(6).fill(-1);priorities.forEach((stat,n)=>b.assign[stat]=sorted[n].i);render();return}
if(act==='finish-create'){createHero();return}
if(act==='close-dialog'||act==='close-shop'){closeScene();return}
if(act==='elder'){s.dialog={id:'elder'};render();return}
if(act==='elder-reward'){s.dialog={id:'elderReward'};render();return}
if(act==='accept-main'||act==='accept-reward'){if(!s.quest.main){s.quest.main=true;adjustTrust('borin',act==='accept-reward'?-1:1);emit('Missione principale iniziata: Il Sigillo dell’Aurora.')}if(act==='accept-reward'&&!s.flags.rewardTaken){s.gold+=8;s.flags.rewardTaken=true;emit('Elara ti consegna 8 monete per il viaggio.')}info('Elara traccia una croce sulla mappa: «Cerca il sigillo nella Selva Chiara e la chiave nella Miniera Antica. Solo allora le rovine potranno aprirsi.»');return}
if(act==='elder-advice'){info('«Non sottovalutare le cose piccole», dice Elara. «Un amico, una pozione o un riparo possono salvare la vita più di una spada.»');return}
if(act==='healer'){s.quest.herbs=true;s.dialog={id:'healer'};render();return}
if(act==='accept-herbs'){s.quest.herbs=true;info('«Le erbe crescono nei prati della Selva Chiara», spiega Mira. «Fai attenzione ai lupi.»');return}
if(act==='deliver-herbs'){if(!has('herb')||s.flags.herbDelivered)return;add('herb',-1);s.flags.herbDelivered=true;s.gold+=12;add('potion');gainXP(25);adjustTrust('borin',1);emit('Missione completata: Erbe per Mira (+12 oro, 1 pozione).');info('Mira prende le erbe con gratitudine: «Ora potrò aiutare molte persone». Ti consegna una pozione e 12 monete. Borin approva in silenzio.');maybeLevel();render();return}
if(act==='shop'){s.shop=true;s.dialog=null;s.quest.lantern=true;render();return}
if(act==='deliver-lantern'){if(!has('lantern')||s.flags.lanternDelivered)return;add('lantern',-1);s.flags.lanternDelivered=true;s.gold+=18;gainXP(25);adjustTrust('lyria',1);emit('Missione completata: La lanterna di Tovin (+18 oro e sconto).');info('Tovin abbraccia la lanterna come un vecchio amico. «D’ora in poi, per te, tre monete di sconto sulla mia merce!»');maybeLevel();render();return}
if(act==='inn'){s.dialog={id:'inn'};render();return}
if(act==='rest'||act==='mercy-rest'){if(act==='rest'){if(s.gold<5)return;s.gold-=5}else{if(s.gold>=5||s.flags.mercyRest)return;s.flags.mercyRest=true;adjustTrust('borin',1)}s.hero.hp=s.hero.maxHp;s.hero.charges=s.hero.maxCharges;s.companions.forEach(x=>x.hp=x.max);emit('Il gruppo riposa e recupera tutte le energie.');info(act==='mercy-rest'?'La locandiera ti offre una notte di riposo: «Me la restituirai quando potrai.»':'Dopo una cena calda e una notte tranquilla il gruppo è completamente riposato.');return}
if(act==='hut'){s.dialog={id:'hut'};render();return}
if(act==='hut-take'||act==='hut-leave'){s.flags.hutSeen=true;if(act==='hut-take'){s.gold+=9;adjustTrust('lyria',1);adjustTrust('borin',-1);emit('Hai preso 9 monete dalla capanna.');info('Nascondi le monete nella sacca. Lyria approva con un sorriso, ma Borin distoglie lo sguardo.')}else{adjustTrust('borin',1);emit('Hai lasciato intatte le monete della capanna.');info('Chiudi con cura la scatola. Borin ti ringrazia per aver rispettato la promessa dello sconosciuto.')}return}
if(act==='trail'){if(s.flags.sigilFound||!s.quest.main)return;const ok=startTest(1,13,'Seguendo le tracce senza fare rumore, trovi una pietra cava. All’interno è nascosto il Sigillo del bosco.','Il ramo sotto il tuo piede si spezza. Due predoni sbucano dai cespugli: ti avevano seguito.',okText(), 'close');if(ok){s.flags.sigilFound=true;add('sigil');gainXP(26);adjustTrust('lyria',1);emit('Trovato il Sigillo del bosco nella Selva Chiara.');s.dialog.next='close'}else{s.dialog.next='scouts'}maybeLevel();render();return}
if(act==='gather'){if(s.flags.herbsGathered)return;const ok=startTest(4,12,'Riconosci le erbe lunari grazie alle foglie azzurre. Ne raccogli un fascio senza danneggiarle.','Le piante si trovano sull’altra riva del ruscello. Due lupi vi sbarrano il passaggio.','Continua');if(ok){s.flags.herbsGathered=true;add('herb');gainXP(10);s.dialog.next='close';emit('Raccolte le erbe lunari.')}else{s.dialog.next='wolves'}maybeLevel();render();return}
if(act==='lantern'){if(s.flags.lanternFound)return;const ok=startTest(1,13,'Ti cali con cautela tra le travi e recuperi la lanterna blu senza fare rumore.','Le assi cedono sotto di te. Ti fai male durante la caduta, ma riesci a recuperare la lanterna.','Continua');s.flags.lanternFound=true;add('lantern');s.quest.lantern=true;gainXP(9);if(!ok){s.hero.hp=Math.max(1,s.hero.hp-4);s.dialog.message+=' Perdi 4 PF.'}s.dialog.next='close';emit('Lanterna blu recuperata nella Miniera Antica.');maybeLevel();render();return}
if(act==='shrine-rune'){if(s.flags.shrineTried)return;s.flags.shrineTried=true;const ok=startTest(4,14,'Comprendi il senso del rituale. Un bagliore dolce avvolge il gruppo: il Custode sarà meno resistente.','I simboli si spengono all’improvviso. Un’onda di magia ti investe, infliggendo 4 PF.','Continua');if(ok){s.flags.blessed=true;gainXP(18);adjustTrust('borin',1);emit('Benedizione del Santuario ottenuta.')}else{s.hero.hp=Math.max(1,s.hero.hp-4)}s.dialog.next='close';maybeLevel();render();return}
if(act==='hermit'){s.dialog={id:'hermit'};render();return}
if(act==='hermit-kind'||act==='hermit-rude'){s.flags.hermit=true;adjustTrust('borin',act==='hermit-kind'?1:-1);info(act==='hermit-kind'?'Il pellegrino ti racconta che il Custode è stato corrotto dal silenzio. «Parlagli prima di combattere: potrebbe ricordare perché è stato creato.»':'Il pellegrino si ritrae. «La fretta spesso conduce alla rovina», sussurra.');return}
if(act==='mine-fight'){if(s.flags.mineCleared||!s.quest.main)return;battleStart('mine');return}
if(act==='ruins-guards'){if(!has('sigil')||!has('key')||s.flags.sentriesCleared)return;battleStart('sentries');return}
if(act==='guardian-talk'){s.dialog={id:'guardian'};render();return}
if(act==='guardian-persuade'){const ok=startTest(5,15,'Il Custode esita. «Forse non siete ladri come gli altri.» Parte della magia che lo protegge si affievolisce.','«La vostra voce non mi inganna», risponde il Custode. Le sue rune diventano rosse.','Entra nel combattimento');if(ok){s.flags.guardianWeakened=true;adjustTrust('borin',1);emit('La persuasione ha indebolito il Custode.')}s.dialog.next='guardian';render();return}
if(act==='guardian-fight'){battleStart('guardian');return}
if(act==='test-next'){let next=s.dialog?.next;if(next==='scouts'||next==='wolves'||next==='guardian'){s.dialog=null;battleStart(next);return}closeScene();return}
if(act==='epilogue'){s.ending='won';s.phase='ending';render();return}
if(act==='combat-attack'){beginCombatAction('hit',s.combat.target);return}
if(act==='combat-special'){beginCombatAction('special',s.combat.target);return}
if(act==='combat-defend'){beginCombatAction('defend');return}
if(act==='combat-potion'){beginCombatAction('potion');return}
if(act==='combat-flee'){beginCombatAction('escape');return}
if(act==='death-roll'){beginCombatAction('death');return}
if(act==='death-pass'){beginCombatAction('wait');return}
if(act==='combat-continue'){nextCombat();return}
if(act==='use-potion'){if(!has('potion')||s.hero.hp>=s.hero.maxHp)return;const amount=roll(4)+roll(4)+2,healed=Math.min(amount,s.hero.maxHp-s.hero.hp);s.hero.hp+=healed;add('potion',-1);emit(`${s.hero.name} usa una pozione e recupera ${healed} PF.`);flash(`+${healed} PF recuperati`);render();return}
if(act==='reset-game'){if(!confirm('Vuoi iniziare una nuova partita? Tutti i progressi attuali saranno cancellati, compresa un’eventuale avventura conclusa.'))return;s=newState();save();render();return}
if(act==='export-save'){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='valdombra-salvataggio.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);flash('Salvataggio esportato.');return}

function okText(){return 'Continua'}
function gainTalent(id){if(s.phase!=='level')return;const h=s.hero;h.level++;h.maxHp+=3;h.hp=Math.min(h.maxHp,h.hp+3);if(id==='power')h.attackBonus++;else if(id==='vigor'){h.maxHp+=5;h.hp+=5}else if(id==='energy'){h.maxCharges++;h.charges++}else return;h.talents.push(id);emit(`${h.name} ha raggiunto il livello ${h.level}.`);flash(`Livello ${h.level} raggiunto!`);s.phase='play';if(h.level<3&&h.xp>=[0,45,125][h.level])s.pendingLevel=true;maybeLevel();render()}
document.addEventListener('input',event=>{if(event.target.id==='heroName'&&s.phase==='creation')s.build.name=event.target.value});
document.addEventListener('change',event=>{if(event.target.matches('.ability-select')&&s.phase==='creation'){const index=Number(event.target.dataset.stat),val=Number(event.target.value);if(val!==-1)s.build.assign=s.build.assign.map((v,i)=>i!==index&&v===val?-1:v);s.build.assign[index]=val;render()}});
document.addEventListener('keydown',event=>{let node=event.target.closest?.('[data-travel]');if(node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();node.click()}});
document.addEventListener('click',event=>{const node=event.target.closest?.('[data-act],[data-lineage],[data-class],[data-travel],[data-tab],[data-target],[data-buy],[data-sell],[data-equip],[data-use-potion],[data-talent]');if(!node)return;
 if(node.dataset.act){chooseAction(node.dataset.act);return}

 if(node.dataset.travel&&s.phase==='play'){const place=node.dataset.travel;if(!allowedPlace(place))return;s.location=place;s.visited[place]=true;s.dialog=null;s.shop=false;render();setTimeout(()=>$('#sceneCard')?.scrollIntoView({behavior:'smooth',block:'start'}),50);return}
 if(node.dataset.tab&&s.phase==='play'){s.tab=node.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(node.dataset.target&&s.phase==='combat'&&s.combat.stage==='turn'&&current().id==='hero'){s.combat.target=node.dataset.target;render();return}
 if(node.dataset.buy&&s.phase==='play'&&s.shop){const id=node.dataset.buy,it=ITEMS[id],cost=Math.max(1,it.price-(s.flags.lanternDelivered?3:0));if(!it||cost>s.gold||!(id==='potion'||it.for?.includes(s.hero.role)))return;s.gold-=cost;add(id);emit(`Acquistato ${it.name} per ${cost} monete.`);flash(`Acquistato: ${it.name}`);render();return}
 if(node.dataset.sell&&s.phase==='play'&&s.shop){const id=node.dataset.sell,it=ITEMS[id];if(!it||!has(id)||id===s.equip.weapon||id===s.equip.armor||it.price<=0||it.type==='quest')return;add(id,-1);s.gold+=Math.floor(it.price/2);emit(`Venduto ${it.name}.`);render();return}
 if(node.dataset.equip&&s.phase==='play'){const id=node.dataset.equip,it=ITEMS[id];if(!it||!has(id)||!it.for?.includes(s.hero.role)||!['weapon','armor'].includes(it.type))return;s.equip[it.type]=id;emit(`Equipaggiato: ${it.name}.`);render();return}
 if(node.dataset.usePotion&&s.phase==='play'){chooseAction('use-potion');return}

});
render();
