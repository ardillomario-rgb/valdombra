<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a22"><title>La Cripta di Valdombra</title>
<style>
:root{color-scheme:dark;--bg:#111721;--panel:#1b2430;--panel2:#242f3d;--line:#384457;--fg:#f4eddf;--muted:#aab5c4;--gold:#e3ba72;--red:#d56a65;--green:#66bc8a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#293042 0%,var(--bg) 62%);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}main{max-width:590px;margin:auto;padding:20px 16px 44px;padding-top:max(20px,env(safe-area-inset-top))}h1,h2,h3{font-family:Georgia,serif;letter-spacing:.01em}h1{font-size:29px;line-height:1.12;margin:3px 0 8px}h2{font-size:23px;margin:0 0 8px}p{margin:8px 0 16px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.card{background:rgba(27,36,48,.95);border:1px solid var(--line);border-radius:17px;padding:18px;margin-top:15px;box-shadow:0 8px 30px #0002}.scene{min-height:145px;border-radius:12px;overflow:hidden;background:linear-gradient(115deg,#14202c,#443529 48%,#17212d);display:flex;align-items:center;justify-content:center;font-size:66px;position:relative;margin-bottom:16px}.scene span{filter:drop-shadow(0 8px 9px #0007)}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#090f1680)}button{appearance:none;display:block;width:100%;background:#ad8049;border:1px solid #d9ae73;border-radius:11px;padding:13px 14px;margin:9px 0;color:#fff8ec;font-size:15px;font-weight:750;cursor:pointer;text-align:left}button.secondary{background:var(--panel2);border-color:var(--line)}button:disabled{opacity:.4}button:active{transform:scale(.99)}input{width:100%;padding:13px;color:var(--fg);background:#121a25;border:1px solid #576276;border-radius:10px;font-size:16px}.small{font-size:13px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border:1px solid #806848;color:#e8c58b;border-radius:99px;font-size:11px;padding:4px 9px;font-weight:750;white-space:nowrap}.classchoice{background:var(--panel2);border:1px solid var(--line);padding:13px;border-radius:12px;margin:9px 0;cursor:pointer;display:flex;align-items:center;gap:12px}.classchoice.sel{border:2px solid var(--gold)}.classchoice .emoji{font-size:29px}.bar{height:9px;border-radius:99px;background:#354052;overflow:hidden}.bar>div{height:100%;background:var(--green);transition:width .2s}.bar.enemy>div{background:var(--red)}.status{padding:11px 0;border-bottom:1px solid var(--line)}.fightgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.enemycard{background:var(--panel2);border-radius:12px;padding:13px;text-align:center}.enemycard .emoji{font-size:37px}.log{max-height:230px;overflow:auto;background:#141d27;padding:11px 13px;border-radius:10px;margin-top:12px}.log p{font-size:12px;color:#c9d2de;margin:0 0 8px}.initiative{display:flex;flex-wrap:wrap;gap:5px}.initiative span{font-size:11px;background:#2d3948;border-radius:7px;padding:5px 7px}.initiative .me{background:#635031}.footer{margin-top:17px;text-align:center;color:#75839a;font-size:11px}.subheading{font-weight:800;color:var(--gold);font-size:14px;margin-top:15px}.note{background:#2a3543;border-radius:9px;padding:12px;margin:12px 0}.topline{color:var(--muted);font-size:12px}.danger{color:#f39b93}.success{color:#8dddab}
</style></head><body><main><div class="row"><div><div class="eyebrow">Un'avventura fantasy • Demo offline</div><h1>La Cripta di Valdombra</h1></div><span class="pill" id="badge">Preparazione</span></div><div id="app"></div><div class="footer">Demo gratuita · I progressi sono salvati su questo dispositivo</div></main>
<script>
'use strict';
const classes={warrior:{name:'Guerriero',hp:22,ac:16,atk:5,dmg:8,bonus:1,skill:1,emoji:'⚔️'},rogue:{name:'Ladro',hp:16,ac:14,atk:5,dmg:6,bonus:3,skill:5,emoji:'🏹'},mage:{name:'Mago',hp:14,ac:12,atk:5,dmg:10,bonus:2,skill:2,emoji:'🔮'}};
const STORE='valdombra-demo-v1';
let g;try{g=JSON.parse(localStorage.getItem(STORE))}catch(e){};
if(!g||!g.phase)g={phase:'setup',cls:'warrior',heroName:'Ardan'};
const r=n=>Math.floor(Math.random()*n)+1,hero=()=>classes[g.cls]||classes.warrior,esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(g))}catch(e){}}
function btn(label,action,secondary=false,disabled=false){return `<button ${secondary?'class="secondary"':''} data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function scene(icon){return `<div class="scene"><span>${icon}</span></div>`}
function reset(){g={phase:'setup',cls:'warrior',heroName:'Ardan'};render()}
function begin(){const name=document.getElementById('name').value.trim();if(!name)return;g={phase:'intro',cls:g.cls,heroName:name,hp:hero().hp,maxHp:hero().hp,potion:1,door:null,initiative:[],index:0,round:1,enemies:[],companions:[],log:[],path:''};render()}
function path(x){g.path=x;g.phase='door';render()}
function door(){const roll=r(20),total=roll+hero().skill;g.door={roll,total,success:total>=13};g.phase=total>=13?'chest':'doorFail';render()}
function combat(){const u=[{id:'hero',name:g.heroName,bonus:hero().bonus},{id:'ally1',name:'Lyria',bonus:3},{id:'ally2',name:'Borin',bonus:0},{id:'enemy1',name:'Goblin A',bonus:2},{id:'enemy2',name:'Goblin B',bonus:2}];g.phase='battle';g.enemies=[{id:'enemy1',name:'Goblin A',hp:12,max:12,ac:13},{id:'enemy2',name:'Goblin B',hp:12,max:12,ac:13}];g.companions=[{id:'ally1',name:'Lyria',hp:15,max:15,ac:14},{id:'ally2',name:'Borin',hp:19,max:19,ac:15}];g.initiative=u.map((a,i)=>({...a,i,roll:r(20)})).map(a=>({...a,total:a.roll+a.bonus})).sort((a,b)=>b.total-a.total||b.bonus-a.bonus||a.i-b.i);g.index=0;g.round=1;g.log=['Il gruppo tira l’iniziativa.'];advance();render()}
function next(){g.index++;if(g.index>=g.initiative.length){g.index=0;g.round++;g.log.push('— Round '+g.round+' —')}}
function advance(){for(let steps=0;steps<100;steps++){
if(g.hp<=0){g.phase='lost';return}if(g.enemies.every(e=>e.hp<=0)){g.phase='won';return}
let a=g.initiative[g.index];if(a.id==='hero')return;
if(a.id.startsWith('ally')){const ally=g.companions.find(c=>c.id===a.id);if(ally.hp>0){if(a.id==='ally2'&&(g.hp<=8||g.companions.some(c=>c.hp>0&&c.hp<=6))){const targets=[{id:'hero',hp:g.hp},...g.companions.filter(c=>c.hp>0).map(c=>({id:c.id,hp:c.hp}))].sort((a,b)=>a.hp-b.hp),t=targets[0],heal=r(6)+3;if(t.id==='hero')g.hp=Math.min(g.maxHp,g.hp+heal);else{let c=g.companions.find(c=>c.id===t.id);c.hp=Math.min(c.max,c.hp+heal)}g.log.push(`Borin cura ${t.id==='hero'?'il tuo personaggio':g.companions.find(c=>c.id===t.id).name} (+${heal} PF).`)}else{const e=g.enemies.find(e=>e.hp>0);if(e){const d=r(20),hit=d===20||(d!==1&&d+4>=e.ac),dmg=hit?r(a.id==='ally1'?6:8)+2:0;e.hp=Math.max(0,e.hp-dmg);g.log.push(`${a.name}: ${hit?`colpisce ${e.name} per ${dmg} danni`:'manca il bersaglio'} (d20: ${d}).`)}}}}
else {const e=g.enemies.find(e=>e.id===a.id);if(e&&e.hp>0){const targets=[{id:'hero',ac:hero().ac},...g.companions.filter(c=>c.hp>0).map(c=>({id:c.id,ac:c.ac}))];const t=targets[r(targets.length)-1],d=r(20),hit=d===20||(d!==1&&d+4>=t.ac),dmg=hit?r(6)+1:0;if(t.id==='hero')g.hp=Math.max(0,g.hp-dmg);else g.companions.find(c=>c.id===t.id).hp=Math.max(0,g.companions.find(c=>c.id===t.id).hp-dmg);g.log.push(`${e.name}: ${hit?`colpisce ${t.id==='hero'?'te':g.companions.find(c=>c.id===t.id).name} per ${dmg} danni`:'attacco mancato'} (d20: ${d}).`)}}
next()}}
function act(kind,target){if(g.phase!=='battle'||g.initiative[g.index].id!=='hero')return;
if(kind==='attack'){const e=g.enemies.find(e=>e.id===target&&e.hp>0);if(!e)return;const d=r(20),hit=d===20||(d!==1&&d+hero().atk>=e.ac),dmg=hit?r(hero().dmg)+(d===20?r(hero().dmg):0)+2:0;e.hp=Math.max(0,e.hp-dmg);g.log.push(`TU: ${hit?`colpisci ${e.name} per ${dmg} danni${d===20?' (critico!)':''}`:`manchi ${e.name}`} (d20: ${d}+${hero().atk}).`)}
else if(kind==='potion'){if(!g.potion||g.hp>=g.maxHp)return;const heal=r(8)+4;g.hp=Math.min(g.maxHp,g.hp+heal);g.potion--;g.log.push(`TU: bevi una pozione e recuperi ${heal} PF.`)}else if(kind==='defend'){g.hp=Math.min(g.maxHp,g.hp+2);g.log.push('TU: ti metti in difesa e recuperi 2 PF (regola semplificata).')}else return;
next();advance();render()}
function bar(current,max,enemy=false){return `<div class="bar ${enemy?'enemy':''}"><div style="width:${Math.max(0,current)/max*100}%"></div></div>`}
function draw(){let out='';const c=hero();if(g.phase==='setup'){
out=scene('🏰')+`<div class="card"><h2>Crea il tuo personaggio</h2><p>Una spedizione è scomparsa nelle rovine di Valdombra. Tu e due compagni partirete per scoprire che cosa è successo.</p><label class="small" for="name">Nome dell'avventuriero</label><input id="name" maxlength="32" value="${esc(g.heroName||'Ardan')}"><div class="subheading">Scegli la tua classe</div>`+Object.entries(classes).map(([id,v])=>`<div data-class="${id}" class="classchoice ${g.cls===id?'sel':''}"><span class="emoji">${v.emoji}</span><div><strong>${v.name}</strong><div class="small">${v.hp} PF · CA ${v.ac} · Attacco +${v.atk}</div></div></div>`).join('')+`<p class="small">Lyria (ladra) e Borin (chierico) agiranno automaticamente durante i combattimenti.</p>${btn('Inizia l’avventura →','begin')}</div>`;}
else {out=`<div class="card"><div class="row"><strong>${c.emoji} ${esc(g.heroName)} · ${c.name}</strong><strong>${g.hp}/${g.maxHp} PF</strong></div>${bar(g.hp,g.maxHp)}<div class="small">Classe Armatura ${c.ac} · Pozioni ${g.potion}</div></div>`;
if(g.phase==='intro')out+=`<div class="card">${scene('🏚️')}<h2>L’ingresso della cripta</h2><p>È notte quando raggiungete l'antica fortezza. Il portone principale è crollato, ma due passaggi conducono verso le profondità.</p><p>Lyria osserva alcune impronte nel fango. «Non siamo soli.»</p><p>Borin stringe il suo simbolo sacro. «Io suggerisco prudenza.»</p><strong>Quale percorso scegli?</strong>${btn('Esplora il corridoio sotterraneo','path:corridor')}${btn('Scendi lungo la scala in rovina','path:stairs',true)}</div>`;
else if(g.phase==='door')out+=`<div class="card">${scene('🚪')}<h2>La porta sigillata</h2><p>${g.path==='corridor'?'Il corridoio termina davanti a una porta antica, segnata da strani simboli.':'La scala conduce a una porta di ferro. Alle tue spalle senti dei passi avvicinarsi.'}</p><p>Lyria si inginocchia davanti alla serratura. «Potremmo provare ad aprirla. Ma qualcuno potrebbe sentirci.»</p><div class="note"><strong>Prova di abilità</strong><div class="small">Dado d20 + ${c.skill} · Difficoltà 13</div></div>${btn('🎲 Prova ad aprire la porta','door')}${btn('Lascia la porta e cerca un’altra strada','combat',true)}</div>`;
else if(g.phase==='doorFail')out+=`<div class="card">${scene('⚔️')}<h2>La serratura resiste</h2><p class="danger"><strong>Prova fallita: ${g.door.total} contro CD 13</strong> (d20: ${g.door.roll})</p><p>Il tuo tentativo produce un forte rumore metallico. Due goblin armati emergono dal buio, bloccandovi la strada.</p><p>«Alle armi!» grida Borin.</p>${btn('Preparatevi al combattimento','combat')}</div>`;
else if(g.phase==='chest')out+=`<div class="card">${scene('🗝️')}<h2>Il sigillo ritrovato</h2><p class="success"><strong>Prova riuscita: ${g.door.total} contro CD 13</strong> (d20: ${g.door.roll})</p><p>La serratura cede! Oltre la porta trovate una piccola camera con uno scrigno. Al suo interno c'è un sigillo d'argento appartenuto alla spedizione scomparsa.</p><p>Lyria sorride. «Abbiamo trovato una traccia. È ora di tornare al villaggio.»</p><div class="note"><strong>Fine dell'avventura — Il sigillo ritrovato</strong><p>Hai raggiunto un finale evitando il combattimento.</p></div>${btn('Ricomincia l’avventura','restart')}</div>`;
else if(g.phase==='battle')out+=`<div class="card"><div class="row"><h2>Scontro con i goblin</h2><span class="pill">Round ${g.round}</span></div><div class="fightgrid">`+g.enemies.map(e=>`<div class="enemycard"><div class="emoji">${e.hp>0?'👺':'💀'}</div><strong>${e.name}</strong>${bar(e.hp,e.max,true)}<div class="small">${e.hp}/${e.max} PF · CA ${e.ac}</div></div>`).join('')+`</div><div class="subheading">Compagni</div>`+g.companions.map(a=>`<div class="status"><div class="row"><strong>${a.name}</strong><span class="small">${a.hp}/${a.max} PF</span></div>${bar(a.hp,a.max)}</div>`).join('')+`<div class="subheading">Ordine di iniziativa</div><div class="initiative">`+g.initiative.map((a,i)=>`<span class="${a.id==='hero'?'me':''}">${i+1}. ${esc(a.name)} (${a.total})</span>`).join('')+`</div><div class="subheading">È il tuo turno. Cosa vuoi fare?</div>`+g.enemies.filter(e=>e.hp>0).map(e=>btn('⚔️ Attacca '+e.name,'attack:'+e.id)).join('')+btn('🧪 Bevi pozione ('+g.potion+')','potion',true,!g.potion||g.hp>=g.maxHp)+btn('🛡️ Difenditi (recupera 2 PF)','defend',true)+`<div class="subheading">Registro del combattimento</div><div class="log">`+g.log.slice(-14).reverse().map(line=>`<p>${esc(line)}</p>`).join('')+`</div></div>`;
else if(g.phase==='won'||g.phase==='lost')out+=`<div class="card">${scene(g.phase==='won'?'🏆':'💀')}<h2>${g.phase==='won'?'Vittoria!':'Il gruppo è stato sconfitto'}</h2>${g.phase==='won'?'<p>I due goblin cadono al suolo. Lyria recupera una pergamena dalle loro borse: è una mappa delle profondità della cripta.</p><p>Borin esclama: «Questa potrebbe condurci alla spedizione perduta.»</p><strong>Fine della demo — La mappa ritrovata.</strong>':'<p>I colpi dei goblin ti fanno perdere conoscenza. I compagni cercano di trascinarti fuori dalla cripta.</p><strong>Fine della demo — Sconfitta.</strong>'}${btn('Gioca di nuovo','restart')}</div>`;
}
return out}
function render(){document.getElementById('badge').textContent=({setup:'Preparazione',intro:'Capitolo I',door:'Capitolo I',doorFail:'Capitolo I',chest:'Finale',battle:'Combattimento',won:'Vittoria',lost:'Sconfitta'})[g.phase]||'Avventura';document.getElementById('app').innerHTML=draw();save()}
document.getElementById('app').addEventListener('click',e=>{let cl=e.target.closest('[data-class]');if(cl){let name=document.getElementById('name')?.value;g.cls=cl.dataset.class;if(name)g.heroName=name;render();return}let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='begin')begin();else if(a==='door')door();else if(a==='combat')combat();else if(a==='restart')reset();else if(a.startsWith('path:'))path(a.slice(5));else if(a.startsWith('attack:'))act('attack',a.slice(7));else if(a==='potion'||a==='defend')act(a)});
render();
</script></body></html>
