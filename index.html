<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a22">
<title>La Cripta di Valdombra 2.0</title>
<style>
:root{color-scheme:dark;--bg:#11161e;--panel:#1c2531;--edge:#394555;--muted:#b8c3ce;--gold:#e5bc72;--blue:#8ab9eb;--red:#e37d78;--green:#8cd4aa;--paper:#f0ebe2}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper);background:radial-gradient(ellipse at top,#263140,var(--bg) 60%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:760px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 16px}.brand{font-family:Georgia,serif;font-weight:bold;color:var(--gold);font-size:23px;letter-spacing:.3px}.sub{color:var(--muted);font-size:12px}.pill{font-size:12px;border:1px solid var(--edge);border-radius:50px;padding:5px 9px;color:var(--gold)}.card{border:1px solid var(--edge);background:rgba(28,37,49,.96);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 10px 26px #0002}.hero{background:linear-gradient(155deg,#293a4c,#1b2530 65%,#26242b);padding:23px 18px;position:relative;overflow:hidden}.hero:before{content:'✦';position:absolute;right:13px;top:-28px;font-size:145px;color:#fff1;pointer-events:none}.eyebrow{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700}h1,h2,h3{font-family:Georgia,serif;line-height:1.2;margin:9px 0}h1{font-size:32px}h2{font-size:24px}h3{font-size:19px}p{margin:10px 0}small,.small{font-size:13px;color:var(--muted)}.buttons{display:grid;gap:10px;margin-top:15px}.btn{display:block;text-align:left;width:100%;padding:13px 15px;color:var(--paper);background:#273446;border:1px solid #617084;border-radius:11px;font-weight:650;transition:background .15s}.btn:hover:not(:disabled){background:#35465c}.btn.primary{background:#9d713e;border-color:#d4aa6c;color:#fff}.btn.primary:hover{background:#b1844c}.btn.soft{background:transparent;border-color:#4c5a6b}.btn.danger{border-color:#8d5353}.btn.center{text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{padding:11px;background:#121c27;border:1px solid #405065;border-radius:11px;text-align:center}.stat strong{display:block;font-size:22px;color:var(--gold)}.stat span{display:block;font-size:12px;color:var(--muted)}.field{display:block;margin-top:13px;color:var(--muted);font-size:13px;font-weight:650}.field input,.field select{width:100%;display:block;margin-top:6px;border:1px solid #59687a;border-radius:10px;background:#121a24;color:var(--paper);padding:12px;min-height:45px}.diceRow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0}.die{height:51px;min-width:51px;padding:5px;display:inline-grid;place-items:center;background:#f2e6d0;color:#233044;border:2px solid #cda467;border-radius:10px;font-weight:900;font-size:25px;box-shadow:0 3px 0 #84633e}.die.drop{opacity:.4;text-decoration:line-through}.die.rolling{animation:shake .11s infinite alternate}@keyframes shake{to{transform:translate(2px,-2px) rotate(7deg)}}.meter{background:#3c4753;height:9px;border-radius:10px;overflow:hidden;min-width:75px}.meter>i{display:block;height:100%;background:var(--green);transition:width .3s}.meter.enemy>i{background:var(--red)}.fighter{background:#151e29;border:1px solid #334153;border-radius:12px;padding:12px;margin-top:8px}.fighter.dead{opacity:.45}.tag{font-size:11px;color:var(--gold);background:#42372c;border-radius:40px;padding:3px 8px;white-space:nowrap}.bigroll{width:110px;height:110px;font-size:54px;border-radius:20px;margin:19px auto;display:grid;place-items:center;background:linear-gradient(145deg,#f9f1df,#d6c19d);color:#233044;border:3px solid #aa7946;box-shadow:0 7px 0 #7d5c39,0 18px 28px #0007;font-weight:800}.bigroll{animation:appear .35s ease-out}@keyframes appear{from{transform:scale(.55) rotate(-13deg);opacity:.3}to{transform:scale(1) rotate(0);opacity:1}}.bigroll.rolling{animation:shake .08s infinite alternate}.outcome{border-left:4px solid var(--gold);padding:12px 14px;background:#141e29;border-radius:7px;margin:15px 0}.outcome.hit{border-color:var(--green)}.outcome.miss{border-color:var(--red)}.divider{height:1px;background:#425061;margin:16px 0}.log{font-size:13px;max-height:210px;overflow:auto;color:var(--muted)}.log p{border-bottom:1px solid #344051;padding-bottom:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar .btn{width:auto;padding:8px 11px;font-size:13px}.toast{color:var(--green)}.foot{text-align:center;color:#8895a5;font-size:12px;margin-top:28px}.hidden{display:none!important}.alert{padding:12px;border:1px solid #997245;background:#3a3027;border-radius:10px;font-size:14px}.summary{font-size:14px;background:#121a24;border-radius:10px;padding:12px;color:#cdd5de}details summary{cursor:pointer;font-weight:650;color:var(--gold)}.selectrow{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:8px 0}.selectrow select{padding:8px;width:185px;max-width:62%;background:#101a25;border:1px solid #617084;border-radius:9px;color:#fff}strong{color:#fff}@media(max-width:400px){h1{font-size:28px}.die{height:43px;min-width:43px}.shell{padding-left:11px;padding-right:11px}.card{padding:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head><body><div class="shell"><header class="top"><div><div class="brand">⚔ Valdombra <span style="font-size:12px">2.0</span></div><div class="sub">Un'avventura solitaria, dadi veri e scelte che contano</div></div><div class="pill" id="headerBadge">PROLOGO</div></header><main id="app" aria-live="polite"></main><footer class="foot">Demo gratuita, offline dopo il caricamento · Ispirata ai giochi di ruolo fantasy da tavolo</footer></div>
<script>
(()=>{'use strict';
const KEY='valdombra-v2-save';const R=()=>Math.floor(Math.random()*20)+1;const d=n=>1+Math.floor(Math.random()*n);const DICE=()=>Array.from({length:4},()=>d(6));const mods=n=>Math.floor((n-10)/2);const signed=n=>n>=0?'+'+n:String(n);const fmt=n=>String(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CLASSES={guerriero:{name:'Guerriero',icon:'⚔️',hit:12,armor:15,attackStat:'FOR',die:8,weapon:'spada',special:'Colpo poderoso'},ladro:{name:'Ladro',icon:'🏹',hit:9,armor:13,attackStat:'DES',die:6,weapon:'pugnale',special:'Colpo preciso'},mago:{name:'Mago',icon:'🔮',hit:7,armor:11,attackStat:'INT',die:10,weapon:'dardo arcano',special:'Esplosione arcana'}};
const RACES={umano:{name:'Umano',bonus:'Aggiungi +1 a una caratteristica a scelta (automaticamente alla primaria)'},elfo:{name:'Elfo',bonus:'Destrezza +2'},nano:{name:'Nano',bonus:'Costituzione +2'}};
const KEYS=['FOR','DES','COS','INT','SAG','CAR'];const LABELS={FOR:'Forza',DES:'Destrezza',COS:'Costituzione',INT:'Intelligenza',SAG:'Saggezza',CAR:'Carisma'};
const initial=()=>({phase:'create',name:'',race:'umano',cls:'guerriero',rolls:[],assign:{},hero:null,scene:'intro',flags:{},inventory:['Pozione curativa'],companions:[],enemies:[],order:[],turnIndex:0,round:1,stage:'',pending:null,battleId:'',log:[],result:null});
let s=load();let rolling=false;function load(){try{const t=JSON.parse(localStorage.getItem(KEY));if(t&&t.phase&&Array.isArray(t.rolls))return t}catch(e){}return initial()}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function update(){save();render()}const app=document.getElementById('app');const badge=document.getElementById('headerBadge');
const btn=(txt,act,css='')=>`<button class="btn ${css}" data-action="${act}">${txt}</button>`;const cards=(title,content)=>`<section class="card"><h2>${title}</h2>${content}</section>`;
function narrative(title,text,opts){return `<section class="card hero"><div class="eyebrow">La cripta di Valdombra</div><h1>${title}</h1><p>${text}</p><div class="buttons">${opts.map(x=>btn(x[0],x[1],x[2]||'')).join('')}</div></section>`}
function header(){const names={create:'CREAZIONE',story:'AVVENTURA',battle:'COMBATTIMENTO',ending:'EPILOGO'};badge.textContent=names[s.phase]||'VALDOMBRA'}
function toolbar(){if(s.phase==='create')return '';return `<div class="toolbar">${btn('👤 Scheda','sheet','soft')}${btn('🎒 Inventario','bag','soft')}${btn('↻ Nuova partita','reset','soft')}</div>`}
function render(){header();let html='';if(s.phase==='create')html=createUI();else if(s.phase==='story')html=storyUI();else if(s.phase==='battle')html=battleUI();else html=endingUI();app.innerHTML=html+toolbar();app.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));app.querySelectorAll('select[data-field]').forEach(e=>e.addEventListener('change',()=>{if(e.dataset.field==='cls')s.cls=e.value;else if(e.dataset.field==='race')s.race=e.value;else if(e.dataset.field.startsWith('assign-')){const k=e.dataset.field.slice(7);s.assign[k]=e.value}update()}));const input=app.querySelector('#name');if(input)input.addEventListener('input',e=>{s.name=e.target.value;save()})}
function createUI(){const count=s.rolls.length;let assignHtml='';if(count===6){let vals=s.rolls.map((x,i)=>({i,total:x.total}));let selected=Object.values(s.assign).filter(x=>x!=='');assignHtml=`<div class="divider"></div><h3>3. Assegna i risultati</h3><p class="small">Ogni tiro si può usare una sola volta. Il gioco aggiunge i bonus della stirpe scelta.</p>${KEYS.map(k=>`<label class="selectrow"><span>${LABELS[k]}</span><select data-field="assign-${k}"><option value="">Scegli tiro...</option>${vals.map(v=>`<option value="${v.i}" ${s.assign[k]===String(v.i)?'selected':''} ${selected.includes(String(v.i))&&s.assign[k]!==String(v.i)?'disabled':''}>Tiro ${v.i+1}: ${v.total}</option>`).join('')}</select></label>`).join('')}<p class="small">${selected.length}/6 valori assegnati.</p>`}
return `<section class="card hero"><div class="eyebrow">Prima dell'avventura</div><h1>Crea il tuo eroe</h1><p>Decidi chi sei, tira i dadi e assegna le sei caratteristiche. I risultati influenzeranno le prove e i combattimenti.</p></section><section class="card"><h3>1. Identità</h3><label class="field">Nome<input id="name" maxlength="26" value="${esc(s.name)}" placeholder="Es. Ardan"></label><label class="field">Stirpe<select data-field="race">${Object.keys(RACES).map(k=>`<option value="${k}" ${s.race===k?'selected':''}>${RACES[k].name}</option>`).join('')}</select></label><p class="small">${RACES[s.race].bonus}</p><label class="field">Classe<select data-field="cls">${Object.keys(CLASSES).map(k=>`<option value="${k}" ${s.cls===k?'selected':''}>${CLASSES[k].icon} ${CLASSES[k].name}</option>`).join('')}</select></label><div class="summary">${CLASSES[s.cls].name}: arma ${CLASSES[s.cls].weapon}, capacità speciale «${CLASSES[s.cls].special}».</div></section><section class="card"><h3>2. Lancia 4d6 sei volte</h3><p class="small">Per ogni punteggio scarta il dado più basso e somma gli altri tre.</p>${s.rolls.map((r,i)=>`<div class="row"><span class="small">Tiro ${i+1}</span><div class="diceRow">${r.dice.map((v,j)=>`<span class="die ${j===r.drop?'drop':''}" style="min-width:36px;height:39px;font-size:19px">${v}</span>`).join('')}</div><strong>${r.total}</strong></div>`).join('')}<div class="buttons">${count<6?btn('🎲 Lancia i dadi ('+(count+1)+'/6)','rollstat','primary'):''}${count>0?btn('Ricomincia i tiri','clearroll','soft'):''}</div>${assignHtml}<div class="buttons">${count===6?btn('Entra nella cripta','start','primary'):''}</div></section>`}
function stats(){return s.hero?.stats||{FOR:10,DES:10,COS:10,INT:10,SAG:10,CAR:10}}
function startHero(){if(s.rolls.length!==6||KEYS.some(k=>s.assign[k]===undefined||s.assign[k]==='')||new Set(KEYS.map(k=>s.assign[k])).size!==6){alert('Assegna tutti e sei i tiri, senza ripetizioni.');return}if(!s.name.trim()){alert('Scegli un nome per il personaggio.');return}const st={};KEYS.forEach(k=>st[k]=s.rolls[+s.assign[k]].total);if(s.race==='elfo')st.DES+=2;else if(s.race==='nano')st.COS+=2;else st[CLASSES[s.cls].attackStat]+=1;const cl=CLASSES[s.cls];const max=Math.max(6,cl.hit+mods(st.COS));s.hero={name:s.name.trim(),race:s.race,cls:s.cls,stats:st,max,hp:max,ac:cl.armor+Math.max(0,mods(st.DES)),potions:1,focus:2,guard:false};s.phase='story';s.scene='intro';s.companions=[{id:'lyria',name:'Lyria',hp:16,max:16,ac:14,attack:5,die:6},{id:'borin',name:'Borin',hp:20,max:20,ac:15,attack:4,die:6}];s.flags={};s.inventory=['Pozione curativa'];s.log=[];update()}
const sceneText={intro:['Il sentiero nella nebbia',`Le rovine di Valdombra emergono tra gli alberi. Una spedizione è scomparsa tre notti fa. Lyria, la ladra del gruppo, indica due ingressi: uno stretto cunicolo con orme fresche e una scala in pietra coperta di muschio. Borin, il chierico, vi osserva in silenzio.`,[['Segui le orme nel cunicolo','pathTrack'],['Esamina la scala antica','pathStair']]],track:['Rumori nel buio',`Il cunicolo odora di cenere. Due voci gutturali discutono dietro una porta malferma. Lyria sussurra: «Possiamo tentare di sorprenderli, oppure cercare di passare senza farci vedere».`,[['Tenta di muoverti furtivamente (DES, CD 13)','stealth'],['Tendi un agguato ai goblin','ambush'],['Fai irruzione, spada alla mano','fight1']]],stair:["L’antico sigillo",`Una pesante porta di pietra blocca il passaggio. Accanto è inciso un simbolo consunto; un'incisione suggerisce che il suo significato possa essere decifrato.`,[['Studia le incisioni (INT, CD 13)','rune'],['Forza il battente (FOR, CD 14)','force'],['Torna al cunicolo','pathTrack']]],hall:['La camera delle ceneri',`Oltre il passaggio si trova una sala con bracieri spenti. Un medaglione d'argento è appeso a un pilastro. Dal fondo della sala provengono passi pesanti: un guardiano sorveglia l'uscita.`,[['Prendi il medaglione e affronta il guardiano','medallion'],['Nasconditi dietro una colonna e osserva (SAG, CD 12)','observe'],['Affronta subito il guardiano','fight2']]],after1:['Il corridoio è libero',`I goblin non vi sbarrano più il cammino. Borin trova tracce recenti della spedizione scomparsa, dirette verso la grande camera centrale.`,[['Prosegui verso la camera delle ceneri','hall']]],after2:['Un passaggio verso la luce',`Il guardiano è sconfitto. Dietro di lui si apre una piccola cella: i membri superstiti della spedizione sono vivi, ma esausti. Un forziere contiene una pergamena con la mappa della cripta.`,[['Libera i prigionieri e torna al villaggio','endWin']]],failStealth:['Un passo di troppo',`Una pietra rotola sotto il tuo stivale. Due goblin si voltano di scatto e impugnano le armi. La sorpresa è perduta.`,[['Prepara le armi','fight1']]],passStealth:['Un passaggio silenzioso',`Con movimenti misurati attraversate il cunicolo senza farvi notare. Lyria indica un arco che conduce direttamente alla camera centrale.`,[['Entra nella camera','hall']]],passRune:['Il segreto della pietra',`Riconosci il simbolo: è il sigillo della vecchia fortezza. Premi tre rune nell'ordine corretto e il battente si apre senza rumore.`,[['Attraversa il passaggio','hall']]],failRune:['Un allarme antico',`La runa sbagliata emette un suono metallico. Il portone resta chiuso e dal corridoio laterale arrivano due goblin, richiamati dal rumore.`,[['Difenditi','fight1']]],passForce:['Il portone cede',`Con una spinta potente fai scorrere il battente. La porta si spalanca, ma il rumore echeggia nella cripta: il guardiano sarà in allerta.`,[['Prosegui','hall']]],failForce:['La pietra resiste',`La porta non si muove. Il rumore dei colpi attira due goblin, che emergono da una feritoia laterale.`,[['Affrontali','fight1']]],passObserve:['Una debolezza evidente',`Osservi il guardiano da lontano: una gamba è protetta male e il pavimento vicino al braciere è instabile. Hai scoperto un punto debole: il primo attacco del gruppo sarà più efficace.`,[['Affronta il guardiano','fight2']]],failObserve:['Ti hanno visto',`Il guardiano nota il movimento della tua ombra. Solleva la mazza e avanza ringhiando.`,[['Combatti','fight2']]]};
function storyUI(){const z=sceneText[s.scene]||sceneText.intro;const companions=`<div class="summary"><b>${esc(s.hero.name)}</b> · ${s.hero.hp}/${s.hero.max} PF · CA ${s.hero.ac}<br>Compagni: ${s.companions.map(x=>`${x.name} ${x.hp}/${x.max}`).join(' · ')}</div>`;return companions+narrative(z[0],z[1],z[2].map(x=>[x[0],x[1],x[1]==='fight1'||x[1]==='fight2'?'primary':'']))}
function check(stat,dc,pass,fail){const v=R(),bonus=mods(stats()[stat]),total=v+bonus;const success=total>=dc;s.result={who:s.hero.name,type:'check',die:v,bonus,dc,hit:success,dmg:0,desc:`${LABELS[stat]}: ${v} ${signed(bonus)} = ${total} contro CD ${dc}. ${success?'Prova superata.':'Prova fallita.'}`,nextScene:success?pass:fail};s.phase='battle';s.stage='storyRoll';update()}
function beginBattle(id){s.phase='battle';s.battleId=id;s.stage='start';s.result=null;s.round=1;s.turnIndex=0;s.hero.guard=false;let enemies=id==='goblins'?[{id:'g1',name:'Goblin A',hp:11,max:11,ac:13,attack:4,die:6},{id:'g2',name:'Goblin B',hp:11,max:11,ac:13,attack:4,die:6}]:[{id:'guard',name:'Guardiano della cripta',hp:27,max:27,ac:13,attack:5,die:8}];if(id==='guard'&&s.flags.weakness){enemies[0].hp=22;enemies[0].max=27}if(id==='guard'&&s.flags.medallion)enemies[0].hp=Math.max(1,enemies[0].hp-4);s.enemies=enemies;const units=[{id:'hero',name:s.hero.name,initiative:mods(stats().DES)},{id:'lyria',name:'Lyria',initiative:3},{id:'borin',name:'Borin',initiative:0},...enemies.map(e=>({id:e.id,name:e.name,initiative:2}))];s.order=units.map(u=>({...u,die:R()})).map(u=>({...u,total:u.die+u.initiative})).sort((a,b)=>b.total-a.total||b.initiative-a.initiative);s.log=[`Iniziativa: ${s.order.map(x=>x.name+' '+x.total).join(', ')}.`];update()}
function alive(id){if(id==='hero')return s.hero.hp>0;return [...s.companions,...s.enemies].some(x=>x.id===id&&x.hp>0)}function person(id){return id==='hero'?s.hero:[...s.companions,...s.enemies].find(x=>x.id===id)}function enemy(id){return s.enemies.some(e=>e.id===id)}function hasLivingEnemies(){return s.enemies.some(e=>e.hp>0)}function addLog(t){s.log.push(`R${s.round}: ${t}`)}
const hits=['Il colpo raggiunge la spalla e costringe il bersaglio ad arretrare.','La lama ferisce una gamba: il nemico barcolla ma resta in piedi.','L’attacco colpisce il fianco; l’avversario serra i denti per il dolore.','Il nemico tenta di parare, ma viene ferito al braccio.'];const misses=['Il bersaglio schiva all’ultimo istante.','La lama urta l’armatura senza infliggere danni.','Il colpo passa a pochi centimetri dal bersaglio.','Il nemico intercetta l’attacco con la propria arma.'];
function performAttack(actor,target,special=false){const attacker=person(actor);const victim=person(target);const own=actor==='hero';const base=own?2+mods(stats()[CLASSES[s.hero.cls].attackStat]):(attacker.attack||4);const attackBonus=base+(special?2:0);const roll=R();const hit=roll===20||(roll!==1&&roll+attackBonus>=victim.ac);let damage=0;if(hit){const sides=own?CLASSES[s.hero.cls].die:(attacker.die||6);damage=d(sides)+(own?Math.max(1,mods(stats()[CLASSES[s.hero.cls].attackStat])):2)+(special?2:0);if(roll===20)damage+=d(sides);victim.hp=Math.max(0,victim.hp-damage)}const defeated=victim.hp===0;const desc=hit?(defeated?`${victim.name} crolla al suolo: non può più combattere.`:hits[d(hits.length)-1]):misses[d(misses.length)-1];s.result={who:attacker.name,type:'attack',die:roll,bonus:attackBonus,dc:victim.ac,hit,dmg:damage,desc:`${attacker.name} ${own?'usi': 'usa'} ${own?CLASSES[s.hero.cls].weapon:(actor==='lyria'?'l’arco':actor==='borin'?'la mazza':actor==='guard'?'la mazza':'una lama')} contro ${victim.name}. ${desc}`,target:victim.name,special};addLog(`${attacker.name} → ${victim.name}: d20 ${roll}${signed(attackBonus)} ${hit?'colpito, '+damage+' danni':'mancato'}.`);s.stage='result';update()}
function performHeal(actor){const p=person(actor);const amount=d(6)+3;const old=p.hp;p.hp=Math.min(p.max||p.maxHp,p.hp+amount);s.result={who:p.name,type:'heal',die:null,hit:true,dmg:0,desc:`${p.name} invoca una luce dorata e recupera ${p.hp-old} punti ferita.`};addLog(`${p.name} recupera ${p.hp-old} PF.`);s.stage='result';update()}
function heroAction(type,target){if(s.stage!=='choice')return;if(type==='attack'){performAttack('hero',target);return}if(type==='special'){if(s.hero.focus<1)return;s.hero.focus--;performAttack('hero',target,true);return}if(type==='defend'){s.hero.guard=true;s.result={who:s.hero.name,type:'guard',die:null,desc:'Sollevi la guardia. Fino al tuo prossimo turno la tua Classe Armatura aumenta di 3.'};addLog('Ti metti in difesa.');s.stage='result';update();return}if(type==='potion'){if(s.hero.potions<1)return;s.hero.potions--;s.inventory=s.inventory.filter(x=>x!=='Pozione curativa');const heal=d(8)+4;const old=s.hero.hp;s.hero.hp=Math.min(s.hero.max,s.hero.hp+heal);s.result={who:s.hero.name,type:'heal',die:null,desc:`Bevi la pozione curativa: recuperi ${s.hero.hp-old} PF.`};addLog(`Pozione: +${s.hero.hp-old} PF.`);s.stage='result';update()}}
function nextTurn(){if(!hasLivingEnemies()){s.phase='story';s.scene=s.battleId==='goblins'?'after1':'after2';s.enemies=[];update();return}if(s.hero.hp<=0){s.phase='ending';s.flags.victory=false;update();return}for(let i=0;i<s.order.length;i++){s.turnIndex++;if(s.turnIndex>=s.order.length){s.turnIndex=0;s.round++}const a=s.order[s.turnIndex];if(alive(a.id)){s.stage=a.id==='hero'?'choice':'aiReady';s.result=null;if(a.id==='hero')s.hero.guard=false;update();return}}s.stage='choice';update()}
function resolveAI(){const actor=s.order[s.turnIndex];if(!actor||!alive(actor.id)){nextTurn();return}if(enemy(actor.id)){const allies=[{id:'hero',hp:s.hero.hp},...s.companions].filter(x=>x.hp>0);if(!allies.length){s.phase='ending';s.flags.victory=false;update();return}const t=allies[d(allies.length)-1];const p=person(t.id);if(t.id==='hero'&&s.hero.guard){const original=s.hero.ac;s.hero.ac+=3;performAttack(actor.id,t.id);s.hero.ac=original;save()}else performAttack(actor.id,t.id)}else if(actor.id==='borin'&&(s.hero.hp<=Math.ceil(s.hero.max*.45)||s.companions.some(x=>x.hp>0&&x.hp<=Math.ceil(x.max*.4)))){const group=[{id:'hero',hp:s.hero.hp,max:s.hero.max},...s.companions.filter(x=>x.hp>0)].filter(x=>x.hp>0).sort((a,b)=>a.hp/a.max-b.hp/b.max);const t=group[0];const p=person(t.id);const heal=d(6)+4;const prev=p.hp;p.hp=Math.min(p.max,prev+heal);s.result={who:'Borin',type:'heal',die:null,desc:`Borin posa la mano su ${t.id==='hero'?'di te':p.name}. Una luce calda ripristina ${p.hp-prev} PF.`};addLog(`Borin cura ${p.name||s.hero.name}: +${p.hp-prev} PF.`);s.stage='result';update()}else{const targets=s.enemies.filter(x=>x.hp>0);performAttack(actor.id,targets[0].id)}}
function battleUI(){if(s.stage==='storyRoll'){const r=s.result;return `<div class="card"><div class="eyebrow">Prova di abilità</div><h2>${r.hit?'Successo!':'Fallimento'}</h2><div class="bigroll">${r.die}</div><div class="outcome ${r.hit?'hit':'miss'}"><b>d20 ${r.die} ${signed(r.bonus)} = ${r.die+r.bonus}</b> · CD ${r.dc}<p>${r.desc}</p></div>${btn('Continua la storia →','resolveStory','primary')}</div>`}
const turn=s.order[s.turnIndex];const battleName=s.battleId==='goblins'?'I goblin del cunicolo':'Il guardiano della cripta';let act='';if(s.stage==='start'){act=`<div class="alert">L'iniziativa è stata tirata per tutti. L'ordine resterà valido per lo scontro.</div>${btn('Inizia il primo round →','battleStart','primary')}`}else if(s.stage==='choice'){act=`<div class="outcome"><b>È il tuo turno, ${esc(s.hero.name)}.</b><p>Scegli un'azione e il bersaglio. I dadi determineranno il risultato.</p></div><div class="buttons">${s.enemies.filter(e=>e.hp>0).map(e=>btn('⚔️ Attacca '+e.name,'atk:'+e.id)).join('')}${s.hero.focus>0?s.enemies.filter(e=>e.hp>0).map(e=>btn('✨ '+CLASSES[s.hero.cls].special+' → '+e.name+' ('+s.hero.focus+' usi)','special:'+e.id)).join(''):''}${btn('🛡️ Difenditi (+3 CA fino al prossimo turno)','defend','soft')}${s.hero.potions>0?btn('🧪 Bevi una pozione ('+s.hero.potions+')','potion','soft'):''}</div>`}else if(s.stage==='aiReady'){act=`<div class="outcome"><b>È il turno di ${esc(turn.name)}.</b><p>${enemy(turn.id)?'Il nemico si prepara ad agire.':'Il tuo compagno sceglie la propria azione.'}</p></div>${btn('Mostra la sua azione →','aiAct','primary')}`}else if(s.stage==='result'){const r=s.result;act=`<div class="outcome ${r.hit===false?'miss':r.hit===true?'hit':''}"><div class="eyebrow">${esc(r.who)} · ${r.type==='attack'?'Tiro per colpire':r.type==='heal'?'Guarigione':'Azione difensiva'}</div>${r.die!==null?`<div class="bigroll">${r.die}</div><h3>${r.hit?'Colpito!':'Mancato!'}</h3><p><b>d20 ${r.die} ${signed(r.bonus)} = ${r.die+r.bonus}</b> contro CA ${r.dc}${r.dmg?' · <b>'+r.dmg+' danni</b>':''}</p>`:''}<p>${esc(r.desc)}</p></div>${btn('Continua →','nextTurn','primary')}`}
const hero=`<div class="fighter"><div class="row"><b>🧑 ${esc(s.hero.name)}</b><span>${s.hero.hp}/${s.hero.max} PF · CA ${s.hero.ac}${s.hero.guard?' (+3 difesa)':''}</span></div><div class="meter"><i style="width:${s.hero.hp/s.hero.max*100}%"></i></div></div>`;
const allies=s.companions.map(c=>`<div class="fighter ${c.hp<=0?'dead':''}"><div class="row"><span>🤝 ${c.name}</span><span>${c.hp}/${c.max} PF</span></div><div class="meter"><i style="width:${c.hp/c.max*100}%"></i></div></div>`).join('');const enemies=s.enemies.map(e=>`<div class="fighter ${e.hp<=0?'dead':''}"><div class="row"><b>👹 ${e.name}</b><span>${e.hp}/${e.max} PF · CA ${e.ac}</span></div><div class="meter enemy"><i style="width:${e.hp/e.max*100}%"></i></div></div>`).join('');return `<section class="card"><div class="row"><div><div class="eyebrow">Battaglia · Round ${s.round}</div><h2>${battleName}</h2></div><span class="tag">${s.stage==='start'?'INIZIATIVA':esc(turn?.name||'Fine')}</span></div><details><summary>Visualizza ordine di iniziativa</summary><p class="small">${s.order.map((a,i)=>`${i+1}. ${esc(a.name)}: ${a.die}${signed(a.initiative)} = ${a.total}`).join('<br>')}</p></details><h3>Avversari</h3>${enemies}<h3>Il tuo gruppo</h3>${hero}${allies}</section><section class="card">${act}</section><details class="card"><summary>📜 Registro del combattimento (${s.log.length})</summary><div class="log">${s.log.slice().reverse().map(x=>`<p>${esc(x)}</p>`).join('')}</div></details>`}
function endingUI(){return narrative(s.flags.victory?'La spedizione è salva':'La cripta reclama un altro eroe',s.flags.victory?'Hai riportato i superstiti al villaggio. Le tue scelte, le prove e i combattimenti hanno deciso il percorso. Questa è la fine della demo 2.0, non della futura campagna.':'I tuoi punti ferita sono scesi a zero. Borin e Lyria tentano di soccorrerti, ma l’avventura termina qui. Potrai riprovare con un diverso approccio.',[['Ricomincia con un nuovo personaggio','reset','primary']])}
function showSheet(){const st=stats();const text=`${esc(s.hero.name)} · ${RACES[s.hero.race].name} · ${CLASSES[s.hero.cls].name}<br>${s.hero.hp}/${s.hero.max} PF · CA ${s.hero.ac}<div class="grid3" style="margin:10px 0">${KEYS.map(k=>`<div class="stat"><span>${LABELS[k]}</span><strong>${st[k]}</strong><span>${signed(mods(st[k]))}</span></div>`).join('')}</div><p>Arma: ${CLASSES[s.hero.cls].weapon} · Capacità: ${CLASSES[s.hero.cls].special} (${s.hero.focus} usi rimasti)</p>`;modal('Scheda del personaggio',text)}
function modal(title,html){const wrap=document.createElement('div');wrap.style='position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:12px;overflow:auto';wrap.innerHTML=`<div class="card" style="max-width:620px;width:100%;max-height:90vh;overflow:auto"><div class="row"><h2>${title}</h2><button class="btn soft" style="width:auto" id="close-modal">Chiudi ✕</button></div>${html}</div>`;document.body.appendChild(wrap);wrap.querySelector('#close-modal').onclick=()=>wrap.remove();wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()})}
function action(a){if(a==='rollstat'){const dice=DICE();const drop=dice.indexOf(Math.min(...dice));s.rolls.push({dice,drop,total:dice.reduce((p,c)=>p+c,0)-dice[drop]});update();return}if(a==='clearroll'){s.rolls=[];s.assign={};update();return}if(a==='start'){startHero();return}if(a==='sheet'){showSheet();return}if(a==='bag'){modal('Inventario',`<p>${s.inventory.length?s.inventory.map(x=>'🎒 '+esc(x)).join('<br>'):'Non possiedi oggetti consumabili.'}</p><p class="small">Le pozioni vengono consumate quando le utilizzi in battaglia.</p>`);return}if(a==='reset'){if(confirm('Vuoi davvero cancellare questa partita e ricominciare?')){s=initial();update()}return}if(a==='pathTrack'){s.scene='track';update();return}if(a==='pathStair'){s.scene='stair';update();return}if(a==='hall'){s.scene='hall';update();return}if(a==='fight1'||a==='ambush'){if(a==='ambush')s.flags.surprise=true;beginBattle('goblins');return}if(a==='fight2'){beginBattle('guard');return}if(a==='medallion'){s.flags.medallion=true;s.inventory.push('Medaglione d’argento');beginBattle('guard');return}if(a==='stealth'){check('DES',13,'passStealth','failStealth');return}if(a==='rune'){check('INT',13,'passRune','failRune');return}if(a==='force'){check('FOR',14,'passForce','failForce');return}if(a==='observe'){const roll=R(),bon=mods(stats().SAG);s.flags.weakness=roll+bon>=12;s.result={who:s.hero.name,type:'check',die:roll,bonus:bon,dc:12,hit:s.flags.weakness,desc:s.flags.weakness?'Hai individuato il punto debole del guardiano.':'Il guardiano ti ha individuato.',nextScene:s.flags.weakness?'passObserve':'failObserve'};s.phase='battle';s.stage='storyRoll';update();return}if(a==='resolveStory'){s.phase='story';s.scene=s.result.nextScene;s.result=null;update();return}if(a==='battleStart'){s.turnIndex=-1;nextTurn();return}if(a==='aiAct'){resolveAI();return}if(a==='nextTurn'){nextTurn();return}if(a==='defend'||a==='potion'){heroAction(a);return}if(a.startsWith('atk:')){heroAction('attack',a.slice(4));return}if(a.startsWith('special:')){heroAction('special',a.slice(8));return}if(a==='endWin'){s.phase='ending';s.flags.victory=true;update();return}}
// Check for defeat/win only after displaying the attack result, preserving every narration.
const oldNext=nextTurn;nextTurn=function(){if(s.stage==='result'&&s.hero.hp<=0){s.phase='ending';s.flags.victory=false;update();return}if(s.stage==='result'&&!hasLivingEnemies()){s.phase='story';s.scene=s.battleId==='goblins'?'after1':'after2';s.stage='';update();return}oldNext()};
render();
})();
</script></body></html>
